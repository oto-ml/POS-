<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurante Upiicsa</title>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // NUEVA PALETA
              primary: "#4169E1",         // Royal Blue
              "primary-hover": "#2B4BB5", // Un tono más oscuro para hover
              "background-light": "#F5F8FA",
              "background-dark": "#202930", // Un gris azulado muy oscuro para el fondo
              "surface-dark": "#36454F",    // Charcoal (Tu color pedido)
              "surface-darker": "#1A2228",  // Casi negro para contrastes
              secondary: "#B0C4DE",         // LightSteelBlue para textos secundarios
            },
            fontFamily: {
              display: ["Work Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #202930; /* Coincide con background-dark */
        color: white;
      }
      /* Custom Scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #202930; 
      }
      ::-webkit-scrollbar-thumb {
        background: #36454F; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4169E1; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
